# Publica una versión del modpack y, si se indica, del launcher.
# Necesita el secreto UMBRAL_SIGNING_KEY (docs/ADMINISTRAR_GITHUB.md).
name: Publicar
on:
  workflow_dispatch:
    inputs:
      version:
        description: Versión del modpack (ej. 1.2.0)
        required: true
      launcher_version:
        description: Versión del launcher a publicar; vacío si no cambia
        required: false
      primera:
        description: Es la primera publicación
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  publicar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Instalar NSIS
        if: inputs.launcher_version != ''
        run: choco install nsis -y --no-progress
      - name: Compilar launcher e instalador
        if: inputs.launcher_version != ''
        shell: bash
        env:
          VERSION: ${{ inputs.launcher_version }}
          MANIFEST_URL: https://github.com/${{ github.repository }}/releases/latest/download/manifest.json
          CLIENT_ID: ${{ vars.UMBRAL_CLIENT_ID }}
        run: |
          export PATH="$PATH:/c/Program Files (x86)/NSIS"
          ./build.sh
      - name: Generar y firmar el manifiesto
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          UMBRAL_SIGNING_KEY: ${{ secrets.UMBRAL_SIGNING_KEY }}
          V: ${{ inputs.version }}
          LV: ${{ inputs.launcher_version }}
          PRIMERA: ${{ inputs.primera }}
        run: |
          args=(--version "$V")
          if [[ "$PRIMERA" == "true" ]]; then args+=(--previous none); else args+=(--previous latest); fi
          if [[ -n "$LV" ]]; then
            mkdir -p dist/lanzar
            cp dist/UmbralLauncher.exe dist/umbral-updater.exe dist/lanzar/
            args+=(--launcher-dir dist/lanzar --launcher-version "$LV" --setup dist/UmbralSetup.exe)
          elif [[ "$PRIMERA" != "true" ]]; then
            # El enlace de descarga apunta a la última versión: el instalador pasa a cada una.
            gh release download --pattern UmbralSetup.exe --dir dist
            args+=(--setup dist/UmbralSetup.exe)
          fi
          go run ./cmd/umbral-publisher release "${args[@]}"
      - name: Publicar en GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: go run ./cmd/umbral-publisher publish
